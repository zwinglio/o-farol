# /etc/nginx/sites-available/ofarol-cms — WordPress headless (PHP-FPM)
# Troque cms.ofarol.com.br e o socket do PHP-FPM se necessário.

# Limite de tentativas de login (por IP).
limit_req_zone $binary_remote_addr zone=ofarol_login:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name cms.ofarol.com.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.ofarol.com.br;

    ssl_certificate     /etc/letsencrypt/live/cms.ofarol.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.ofarol.com.br/privkey.pem;

    root /srv/ofarol/wordpress;
    index index.php;
    client_max_body_size 64m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nada de dotfiles (.env, .git), logs, dumps ou arquivos que revelam versão.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(log|sql|sh|bak|md)$ { deny all; }
    location ~* ^/(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt)$ { deny all; }
    location = /xmlrpc.php { deny all; }

    # PHP nunca executa em uploads nem é chamado direto em plugins/temas.
    location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ { deny all; }
    location ~* ^/wp-content/(plugins|mu-plugins|themes)/.*\.php$ { deny all; }
    # Código-fonte e manifests de build dos plugins.
    location ~* ^/wp-content/plugins/[^/]+/(src|node_modules)/ { deny all; }
    location ~* ^/wp-content/plugins/[^/]+/(package\.json|bun\.lock)$ { deny all; }

    location = /wp-login.php {
        limit_req zone=ofarol_login burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location ~* \.(?:jpe?g|png|gif|webp|avif|ico|svg|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
}
