# /etc/nginx/sites-available/ofarol-front — Astro (SSR) atrás do nginx
# Troque ofarol.com.br. O Astro escuta só em 127.0.0.1:4321 (front/.env).

server {
    listen 80;
    listen [::]:80;
    server_name ofarol.com.br www.ofarol.com.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://ofarol.com.br$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ofarol.com.br;
    ssl_certificate     /etc/letsencrypt/live/ofarol.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ofarol.com.br/privkey.pem;
    return 301 https://ofarol.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ofarol.com.br;

    ssl_certificate     /etc/letsencrypt/live/ofarol.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ofarol.com.br/privkey.pem;

    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml text/plain text/markdown image/svg+xml;

    # Os demais cabeçalhos de segurança (CSP etc.) vêm do próprio Astro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Arquivos com hash no nome: cache "para sempre".
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        # O Astro confia nestes cabeçalhos só para o domínio de PUBLIC_SITE_URL
        # (security.allowedDomains em astro.config.mjs).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
